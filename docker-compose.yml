# Local stack: PostgreSQL + the DentAssist API.
#   docker compose up -d --build
#   docker compose exec api python -m app.seed      # load demo data (first run only)
# API docs: http://localhost:8000/docs
services:
  db:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_USER: dentassist
      POSTGRES_PASSWORD: dentassist
      POSTGRES_DB: dentassist
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U dentassist -d dentassist"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build: ./backend
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql+psycopg://dentassist:dentassist@db:5432/dentassist
      JWT_SECRET_KEY: ${JWT_SECRET_KEY:-dev-only-secret-change-me-0123456789abcdef}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:3000,http://127.0.0.1:3000}
      DEMO_PASSWORD: ${DEMO_PASSWORD:-Demo@1234}
      # Online payments: set these in a .env file next to this compose file to switch them on.
      RAZORPAY_KEY_ID: ${RAZORPAY_KEY_ID:-}
      RAZORPAY_KEY_SECRET: ${RAZORPAY_KEY_SECRET:-}
      RAZORPAY_WEBHOOK_SECRET: ${RAZORPAY_WEBHOOK_SECRET:-}
      WHATSAPP_PROVIDER: ${WHATSAPP_PROVIDER:-console}
      WHATSAPP_ACCESS_TOKEN: ${WHATSAPP_ACCESS_TOKEN:-}
      WHATSAPP_PHONE_NUMBER_ID: ${WHATSAPP_PHONE_NUMBER_ID:-}
      WHATSAPP_VERIFY_TOKEN: ${WHATSAPP_VERIFY_TOKEN:-}
      WHATSAPP_APP_SECRET: ${WHATSAPP_APP_SECRET:-}
      REMINDERS_ENABLED: ${REMINDERS_ENABLED:-true}
      PUBLIC_APP_URL: ${PUBLIC_APP_URL:-http://localhost:3000}
      UPLOAD_DIR: /data/uploads
    volumes:
      - uploads:/data/uploads   # X-rays and documents; back this up with the database
    ports:
      - "8000:8000"

volumes:
  pgdata:
  uploads:
